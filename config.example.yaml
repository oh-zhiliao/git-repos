repos:
  - name: "my-project"
    url: "git@github.com:org/my-project.git"
    branch: "main"

ssh_key_path: "./data/deploy_key"
repos_dir: "./data/repos"

poll_interval_minutes: 5
deep_scan_cron: "0 2 * * *"

memo_url: "http://127.0.0.1:8090"
memo_auth_token: "${MEMO_AUTH_TOKEN}"  # optional; falls back to MEMO_AUTH_TOKEN env var

notifications:
  my-project: ["oc_xxxxx"]

admins: ["ou_xxxxxxx"]

# Knowledge system — per-repo curated documentation
# Knowledge lives in a separate git repo for flexibility
# See docs/knowledge.md for the full generation guide
knowledge:
  repo_url: "git@github.com:org/project-knowledge.git"
  branch: "main"
  local_dir: "./data/knowledge"

  # Sync settings (always active when knowledge is configured)
  sync:
    pull_interval_minutes: 30

  # Internal generation (optional — set enabled: false for external-only mode)
  generation:
    enabled: true
    cron: "0 3 * * *"            # daily at 3am, null to disable
    max_topics: 8
    context_token_budget: 50000
    language: Chinese             # output language (default: Chinese)
